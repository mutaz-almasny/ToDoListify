<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الصفحة الرئيسية</title>
  <link rel="stylesheet" href="/src/output.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    @keyframes slideIn {
      0% {
        transform: translateY(100px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .animate-slideInText {
      animation: slideIn 1s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="h-24 md:h-32 w-full bg-primary-color border-3 border-t-0 rounded-b-[52px] border-black px-8 shadow-[1px_5px_4px_0px_#00000040] md:shadow-none md:rounded-br-[52px] md:rounded-b-none md:border-b-2 md:border-r-2 md:border-l-0">
    <div class="h-full flex items-center space-x-5 relative">
      <div class="relative">
        <h1 class="font-inter-900 italic text-4xl md:text-5xl text-black hidden md:block">TO DO Listify</h1>
        <span class="hidden absolute left-2 w-[265px] rounded-r-2xl rounded-l-2xl h-1 bg-white md:block"></span>
      </div>
      <span class="h-8 bg-white rounded-lg w-2 mt-4 hidden md:block"></span>
      <div class="absolute left-0 md:relative">
        <h1 id="name" class="font-inter-900 italic text-[26px] md:text-5xl text-black md:mt-5"></h1>
      </div>
      <button id="logOut" class="font-inter-900 w-24 h-8 rounded-full bg-black text-white text-[16px] col-span-2 absolute right-0 md:col-span-2 justify-self-center cursor-pointer hover:text-primary-color active:scale-95 md:w-36 md:h-16 md:text-2xl md:font-inter-600">LogOut</button>
    </div>
  </header>

  <div class="flex-1 w-full flex md:h-5/6">
    <aside class="  w-[12%] bg-primary-color rounded-br-[52px] hidden md:block lg:w-[7%]">
      <div class="w-full h-full flex flex-col items-center pt-5 space-y-6">
        <a href="settings.html" class="bg-white size-18 flex items-center justify-center pt-3 border-3 rounded-full">
          <img src="/Images/icons/person.png" alt="" class="h-14 w-9"/>
        </a>
        <a href="/src/HTML/home.html" class="bg-white h-18 pr-6 w-26 ml-6 rounded-l-full flex items-center justify-center">
          <img src="/Images/icons/home.png" alt="" />
        </a>
        <a href="search.html" class="bg-white size-18 flex items-center border-3 justify-center rounded-full">
          <img src="/Images/icons/search.png" alt="" />
        </a>
        <a href="/src/HTML/new_task.html" class="bg-white size-18 flex items-center border-3 justify-center rounded-full">
          <img src="/Images/icons/plus.png" alt="" />
        </a>
      </div>
    </aside>

    <main id="gridContainer" class="w-full pt-4 p-4 grid grid-cols-1 md:pl-16 md:pt-12 md:grid-cols-2">
        <!-- Cards -->

    </main>
  </div>

  <footer class="w-full rounded-t-[40px] border-2 border-black flex justify-between px-5 py-2 items-center bg-primary-color md:bg-transparent md:h-0 md:pt-5 md:items-start md:relative md:rounded-t-0 md:hidden">
    <a href="/src//HTML/home.html" class="bg-white size-16 flex items-center justify-center rounded-full">
      <img src="/Images/icons/home.png" alt="" />
    </a>
    <a href="/src/HTML/new_task.html" class="bg-white size-16 flex items-center border-3 justify-center rounded-full">
      <img src="/Images/icons/plus.png" alt=""  />
    </a>
    <a href="#" class="bg-white size-16 flex items-center border-3 justify-center rounded-full pt-3">
      <img src="/Images/icons/person.png" alt="" class="h-14 w-9"/>
    </a>
  </footer>

  <script src="/node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="/node_modules/axios/dist/axios.min.js"></script>
    <script src="/js/home.js" type="module"></script>
